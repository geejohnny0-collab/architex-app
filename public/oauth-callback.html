<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Architex OAuth Callback Handler</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0b0f19;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(59, 130, 246, 0.2);
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .success {
      color: #10b981;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="spinner" id="spinner"></div>
  <h2 id="status-title">Authenticating with Google...</h2>
  <p id="status-msg">Redirecting to your Architex profile creation...</p>

  <script>
      async function completeAuth() {
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('code');
        const state = urlParams.get('state');
        const error = urlParams.get('error');
        if (error) {
          document.getElementById('status-title').innerText = "Authentication Failed";
          document.getElementById('status-msg').innerText = error;
          if (window.opener) {
            window.opener.postMessage({ type: 'ARCHITEX_OAUTH_ERROR', error, state }, '*');
          }
          return;
        }

        try {
          // Exchange code with backend or authenticate Google session
          const res = await fetch('/api/auth/google', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ idToken: code || 'google_oauth_code_' + Date.now() })
          });
          const data = await res.json();

          if (data.token && data.user) {
            localStorage.setItem('authToken', data.token);
            localStorage.setItem('authUser', JSON.stringify(data.user));
            localStorage.setItem('needs_onboarding', 'true');

            document.getElementById('status-title').innerText = "Authorization Successful!";
            document.getElementById('status-title').className = "success";
            document.getElementById('status-msg').innerText = "Entering Architex...";

            if (window.opener) {
              window.opener.postMessage({ type: 'ARCHITEX_OAUTH_SUCCESS', token: data.token, user: data.user }, '*');
              setTimeout(() => window.close(), 600);
            } else {
              setTimeout(() => { window.location.href = '/'; }, 600);
            }
          } else {
            throw new Error(data.error || 'Failed to authenticate session');
          }
        } catch (err) {
          console.error('OAuth Callback Error:', err);
          document.getElementById('status-title').innerText = "Authentication Error";
          document.getElementById('status-msg').innerText = err.message || "Failed to complete Google login";
        }
      }

      completeAuth();
  </script>
</body>
</html>
